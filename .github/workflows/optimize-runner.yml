name: HLS Video Optimizer Runner (Self-Hosted)
on:
  workflow_call:
    inputs:
      matrix_json:
        required: true
        type: string

jobs:
  run-matrix:
    name: "${{ matrix.chunk_index }}: ${{ matrix.resolution.label }} - P${{ matrix.part.part_index }}"
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix_json) }}
    permissions:
      contents: read
    steps:
      - name: Checkout worker repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install System Dependencies
        run: |
          NEED_APT=0
          for bin in zip unxz curl; do
            command -v "$bin" >/dev/null || NEED_APT=1
          done
          if [ "$NEED_APT" = "1" ]; then
            # ponytail: parallel matrix jobs on the same runner box race for the dpkg lock; flock serializes instead of failing
            sudo flock /var/lib/dpkg/lock-frontend -c "apt-get update -qq && apt-get install -y zip xz-utils curl"
          fi
          STAMP=/usr/local/bin/.ffmpeg-build-stamp
          ASSET=ffmpeg-master-latest-linux64-gpl.tar.xz
          REMOTE_VERSION=$(curl -fsSL https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest \
            | grep -A15 "\"name\": \"$ASSET\"" | grep -m1 '"updated_at"' | sed -E 's/.*"updated_at": *"([^"]+)".*/\1/')

          if [ -n "$REMOTE_VERSION" ] && command -v ffmpeg >/dev/null \
             && [ "$(cat "$STAMP" 2>/dev/null)" = "$REMOTE_VERSION" ] \
             && ffmpeg -buildconf 2>/dev/null | grep -q svtav1; then
            echo "ffmpeg already up to date ($REMOTE_VERSION), skipping download"
            ffmpeg -version | head -1
          else
            echo "Downloading FFmpeg static build (remote build: ${REMOTE_VERSION:-unknown, API lookup failed})..."
            if ! curl -fsSL --retry 5 --retry-delay 5 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$ASSET -o /tmp/ffmpeg.tar.xz; then
              echo "Error: Failed to download FFmpeg from BtbN/FFmpeg-Builds."
              exit 1
            fi
            if head -n 5 /tmp/ffmpeg.tar.xz | grep -q -i -E "html|doctype|xml"; then
              echo "Error: Downloaded file is HTML/XML instead of a valid archive. Printing contents:"
              cat /tmp/ffmpeg.tar.xz | head -n 50
              exit 1
            fi
            mkdir -p /tmp/ffmpeg-extract
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-extract --strip-components=1
            sudo cp /tmp/ffmpeg-extract/bin/ffmpeg /usr/local/bin/
            sudo cp /tmp/ffmpeg-extract/bin/ffprobe /usr/local/bin/
            sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
            rm -rf /tmp/ffmpeg.tar.xz /tmp/ffmpeg-extract
            [ -n "$REMOTE_VERSION" ] && echo "$REMOTE_VERSION" | sudo tee "$STAMP" >/dev/null
            ffmpeg -version | head -1
            ffmpeg -buildconf | grep svtav1 || (echo "ERROR: libsvtav1 not compiled into this ffmpeg build" && exit 1)
          fi
      - name: Run HLS Optimizer
        env:
          ACTIVE_RESOLUTION_LABEL: ${{ matrix.resolution.label }}
          ACTIVE_PART: ${{ toJson(matrix.part) }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          node optimize.js
