name: HLS Video Optimizer Runner (Self-Hosted)
on:
  workflow_call:
    inputs:
      matrix_json:
        required: true
        type: string

jobs:
  run-matrix:
    name: "${{ matrix.chunk_index }}: ${{ matrix.resolution.label }} - P${{ matrix.part.part_index }}"
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix_json) }}
    permissions:
      contents: read
    steps:
      - name: Checkout worker repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install System Dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEED_APT=0
          for bin in zip unxz curl; do
            command -v "$bin" >/dev/null || NEED_APT=1
          done
          if [ "$NEED_APT" = "1" ]; then
            # ponytail: parallel matrix jobs on the same runner box race for the dpkg lock; flock serializes instead of failing
            sudo flock /var/lib/dpkg/lock-frontend -c "apt-get update -qq && apt-get install -y zip xz-utils curl"
          fi
          # ponytail: 3 runner agents share this VPS; a shared /usr/local/bin/ffmpeg races with
          # whichever agent is mid-encode (ETXTBSY on overwrite). Cache per-agent instead.
          FFDIR="$HOME/.cache/ffmpeg-${RUNNER_NAME:-default}"
          mkdir -p "$FFDIR"
          echo "$FFDIR" >> "$GITHUB_PATH"
          export PATH="$FFDIR:$PATH"

          STAMP="$FFDIR/.build-stamp"
          case "$(uname -m)" in
            aarch64|arm64) FFARCH=linuxarm64 ;;
            *) FFARCH=linux64 ;;
          esac
          ASSET=ffmpeg-master-latest-${FFARCH}-gpl.tar.xz
          REMOTE_VERSION=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest \
            | grep -A40 "\"name\": \"$ASSET\"" | grep -m1 '"updated_at"' | sed -E 's/.*"updated_at": *"([^"]+)".*/\1/')

          if [ -n "$REMOTE_VERSION" ] && command -v ffmpeg >/dev/null \
             && [ "$(cat "$STAMP" 2>/dev/null)" = "$REMOTE_VERSION" ] \
             && ffmpeg -buildconf 2>/dev/null | grep -q svtav1; then
            echo "ffmpeg already up to date ($REMOTE_VERSION), skipping download"
            ffmpeg -version | head -1
          else
            echo "Downloading FFmpeg static build (remote build: ${REMOTE_VERSION:-unknown, API lookup failed})..."
            DL="${RUNNER_TEMP:-/tmp}/ffmpeg.tar.xz"
            EXTRACT="${RUNNER_TEMP:-/tmp}/ffmpeg-extract"
            if ! curl -fsSL --retry 5 --retry-delay 5 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$ASSET -o "$DL"; then
              echo "Error: Failed to download FFmpeg from BtbN/FFmpeg-Builds."
              exit 1
            fi
            if head -n 5 "$DL" | grep -q -i -E "html|doctype|xml"; then
              echo "Error: Downloaded file is HTML/XML instead of a valid archive. Printing contents:"
              cat "$DL" | head -n 50
              exit 1
            fi
            mkdir -p "$EXTRACT"
            tar -xf "$DL" -C "$EXTRACT" --strip-components=1
            cp "$EXTRACT/bin/ffmpeg" "$EXTRACT/bin/ffprobe" "$FFDIR/"
            chmod +x "$FFDIR/ffmpeg" "$FFDIR/ffprobe"
            rm -rf "$DL" "$EXTRACT"
            [ -n "$REMOTE_VERSION" ] && echo "$REMOTE_VERSION" > "$STAMP"
            ffmpeg -version | head -1
            ffmpeg -buildconf | grep svtav1 || (echo "ERROR: libsvtav1 not compiled into this ffmpeg build" && exit 1)
            ffmpeg -h encoder=libx264 2>&1 | grep -q yuv420p10le || echo "WARNING: libx264 in this ffmpeg build lacks 10-bit (yuv420p10le) support — 10-bit sources will fall back to 8-bit encoding"
          fi
      - name: Configure work directory
        run: |
          # Use RUNNER_TEMP, which is native to each self-hosted runner instance
          # (e.g., /root/actions-runner-1/_work/_temp). This guarantees complete
          # isolation between runner agents on the same VPS without littering $HOME.
          # Append run, matrix chunk, resolution, and part index details so parallel
          # jobs never collide or wipe each other's cache/work directories during post-cleanup.
          WORKDIR="${RUNNER_TEMP:-/tmp}/hls-work-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.chunk_index }}-${{ matrix.resolution.label }}-P${{ matrix.part.part_index }}"
          mkdir -p "$WORKDIR"
          echo "HLS_WORK_DIR=$WORKDIR" >> "$GITHUB_ENV"
          echo "Work dir: $WORKDIR"
      - name: Run HLS Optimizer
        env:
          ACTIVE_RESOLUTION_LABEL: ${{ matrix.resolution.label }}
          ACTIVE_PART: ${{ toJson(matrix.part) }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          node optimize.js
      - name: Cleanup work directory
        if: always()
        run: |
          if [ -n "$HLS_WORK_DIR" ] && [ -d "$HLS_WORK_DIR" ]; then
            echo "Cleaning up work directory: $HLS_WORK_DIR"
            rm -rf "$HLS_WORK_DIR" 2>/dev/null || true
          fi
