name: HLS Video Optimizer (Self-Hosted)
on:
  repository_dispatch:
    types: [optimize-hls]
jobs:
  setup:
    runs-on: self-hosted
    outputs:
      kind: ${{ steps.parse.outputs.kind }}
      parts_json: ${{ steps.parse.outputs.parts_json }}
      resolutions_json: ${{ steps.parse.outputs.resolutions_json }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Parse payload
        id: parse
        run: |
          node -e '
            const fs = require("fs");
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
            const payload = event.client_payload || {};
            const resolutions = payload.resolutions || [{"label":"1080p"}];
            const parts = payload.parts || [{"part_index":1,"start_time":0,"end_time":null,"start_segment_index":0,"extract_subtitles":true,"extract_audio":true}];
            console.log(`kind=${payload.kind || ""}`);
            console.log(`parts_json=${JSON.stringify({ include: parts })}`);
            console.log(`resolutions_json=${JSON.stringify(resolutions)}`);
          ' >> "$GITHUB_OUTPUT"

  # One call to per-part-runner.yml PER PART, all in parallel (matrix). Each call
  # independently detects its own part's field/scene plan, then fans out its own
  # resolution jobs as soon as ITS detection is done - it never waits on other parts.
  per-part:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.parts_json) }}
    uses: ./.github/workflows/per-part-runner.yml
    with:
      kind: ${{ needs.setup.outputs.kind }}
      part_json: ${{ toJson(matrix) }}
      resolutions_json: ${{ needs.setup.outputs.resolutions_json }}
    secrets: inherit
