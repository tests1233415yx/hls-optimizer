name: HLS Video Optimizer (Self-Hosted)
on:
  repository_dispatch:
    types: [optimize-hls]
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.set-matrix.outputs.chunks }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate Matrix
        id: set-matrix
        run: |
          echo "chunks<<EOF" >> $GITHUB_OUTPUT
          node -e '
            const fs = require("fs");
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
            const payload = event.client_payload || {};
            const resolutions = payload.resolutions || [{"label":"1080p"}];
            const parts = payload.parts || [{"part_index":1,"start_time":0,"end_time":null,"start_segment_index":0,"extract_subtitles":true,"extract_audio":true}];
            let include = payload.include || [];
            if (include.length === 0) {
              for (const r of resolutions) {
                for (const p of parts) {
                  if (r.label === "subtitles" && p.part_index > 1) {
                    continue; // Only run subtitles for Part 1
                  }
                  include.push({ resolution: r, part: p });
                }
              }
            } else {
              include = include.map(item => {
                const fullRes = resolutions.find(r => r.label === item.resolution.label) || item.resolution;
                const fullPart = parts.find(p => p.part_index === item.part.part_index) || item.part;
                return { resolution: fullRes, part: fullPart };
              });
            }
            const CHUNK_SIZE = 256;
            const chunks = [];
            for (let i = 0; i < include.length; i += CHUNK_SIZE) {
              const chunkIndex = Math.floor(i / CHUNK_SIZE) + 1;
              const chunkItems = include.slice(i, i + CHUNK_SIZE).map(item => ({
                ...item,
                chunk_index: chunkIndex
              }));
              chunks.push({
                include: chunkItems
              });
            }
            console.log(JSON.stringify(chunks));
          ' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  optimize:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.setup.outputs.chunks) }}
    uses: ./.github/workflows/optimize-runner.yml
    with:
      matrix_json: ${{ toJson(matrix.chunk) }}
    secrets: inherit
