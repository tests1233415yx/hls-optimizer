name: HLS Video Optimizer (Koyeb Self-Hosted)

on:
  repository_dispatch:
    types: [optimize-hls]

jobs:
  optimize:
    name: Process HLS Video (Koyeb)
    runs-on: [self-hosted, koyeb]
    container:
      image: node:20-bookworm

    # Restrict runner permissions to minimum
    permissions:
      contents: read

    steps:
      - name: Checkout worker repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y ffmpeg zip

      - name: Run HLS Optimizer
        env:
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          node optimize.js
