name: HLS Per-Part Detect + Dispatch (Self-Hosted)
on:
  workflow_call:
    inputs:
      kind:
        required: true
        type: string
      part_json:
        required: true
        type: string
      resolutions_json:
        required: true
        type: string

jobs:
  # Field strategy + scene-cut timeline are part-scoped, not resolution-scoped (see
  # shouldComputeSegmentTimeline() in optimize.js) - probed once here for this one part.
  # Skipped for kind=="original" (plain remux), which never uses this data.
  detect:
    if: inputs.kind != 'original'
    runs-on: self-hosted
    outputs:
      field_plan_json: ${{ steps.detect.outputs.field_plan_json }}
    steps:
      - name: Checkout worker repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install System Dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEED_APT=0
          for bin in zip unxz curl; do
            command -v "$bin" >/dev/null || NEED_APT=1
          done
          if [ "$NEED_APT" = "1" ]; then
            sudo flock /var/lib/dpkg/lock-frontend -c "apt-get update -qq && apt-get install -y zip xz-utils curl"
          fi
          FFDIR="$HOME/.cache/ffmpeg-${RUNNER_NAME:-default}"
          mkdir -p "$FFDIR"
          echo "$FFDIR" >> "$GITHUB_PATH"
          export PATH="$FFDIR:$PATH"

          STAMP="$FFDIR/.build-stamp"
          case "$(uname -m)" in
            aarch64|arm64) FFARCH=linuxarm64 ;;
            *) FFARCH=linux64 ;;
          esac
          ASSET=ffmpeg-master-latest-${FFARCH}-gpl.tar.xz
          REMOTE_VERSION=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest \
            | grep -A40 "\"name\": \"$ASSET\"" | grep -m1 '"updated_at"' | sed -E 's/.*"updated_at": *"([^"]+)".*/\1/')

          if [ -n "$REMOTE_VERSION" ] && command -v ffmpeg >/dev/null \
             && [ "$(cat "$STAMP" 2>/dev/null)" = "$REMOTE_VERSION" ] \
             && ffmpeg -buildconf 2>/dev/null | grep -q svtav1; then
            echo "ffmpeg already up to date ($REMOTE_VERSION), skipping download"
            ffmpeg -version | head -1
          else
            echo "Downloading FFmpeg static build (remote build: ${REMOTE_VERSION:-unknown, API lookup failed})..."
            DL="${RUNNER_TEMP:-/tmp}/ffmpeg.tar.xz"
            EXTRACT="${RUNNER_TEMP:-/tmp}/ffmpeg-extract"
            if ! curl -fsSL --retry 5 --retry-delay 5 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$ASSET -o "$DL"; then
              echo "Error: Failed to download FFmpeg from BtbN/FFmpeg-Builds."
              exit 1
            fi
            if head -n 5 "$DL" | grep -q -i -E "html|doctype|xml"; then
              echo "Error: Downloaded file is HTML/XML instead of a valid archive. Printing contents:"
              cat "$DL" | head -n 50
              exit 1
            fi
            mkdir -p "$EXTRACT"
            tar -xf "$DL" -C "$EXTRACT" --strip-components=1
            cp "$EXTRACT/bin/ffmpeg" "$EXTRACT/bin/ffprobe" "$FFDIR/"
            chmod +x "$FFDIR/ffmpeg" "$FFDIR/ffprobe"
            rm -rf "$DL" "$EXTRACT"
            [ -n "$REMOTE_VERSION" ] && echo "$REMOTE_VERSION" > "$STAMP"
            ffmpeg -version | head -1
          fi
      - name: Configure work directory
        run: |
          WORKDIR="${RUNNER_TEMP:-/tmp}/hls-field-detect-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$WORKDIR"
          echo "HLS_WORK_DIR=$WORKDIR" >> "$GITHUB_ENV"
          echo "FIELD_DETECT_OUTPUT_PATH=$WORKDIR/field-detect.json" >> "$GITHUB_ENV"
      - name: Run field/scene detection for this part
        id: detect
        env:
          FIELD_DETECT_ONLY: '1'
          ACTIVE_PART: ${{ inputs.part_json }}
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          node optimize.js
          echo "field_plan_json<<EOF" >> "$GITHUB_OUTPUT"
          cat "$FIELD_DETECT_OUTPUT_PATH" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Cleanup work directory
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP:-/tmp}/hls-field-detect-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>/dev/null || true

  # Merges this part's field plan (if any) into it, then builds the resolution matrix
  # for this one part only. Always runs (even when detect was skipped for kind=="original"),
  # but if detect ran and failed, this doesn't run either - no fallback, matching optimize.js's
  # hard-fail check for a missing field plan.
  build_chunk:
    needs: detect
    if: always() && (needs.detect.result == 'success' || needs.detect.result == 'skipped')
    runs-on: self-hosted
    outputs:
      chunks: ${{ steps.build.outputs.chunks }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build resolution matrix for this part
        id: build
        env:
          PART_JSON: ${{ inputs.part_json }}
          RESOLUTIONS_JSON: ${{ inputs.resolutions_json }}
          FIELD_PLAN_JSON: ${{ needs.detect.outputs.field_plan_json }}
        run: |
          echo "chunks<<EOF" >> $GITHUB_OUTPUT
          node -e '
            const resolutions = JSON.parse(process.env.RESOLUTIONS_JSON);
            const part = JSON.parse(process.env.PART_JSON);

            if (process.env.FIELD_PLAN_JSON) {
              const result = JSON.parse(process.env.FIELD_PLAN_JSON);
              if (result.field_plan) part.field_plan = result.field_plan;
              if (result.forced_keyframe_string) part.forced_keyframe_string = result.forced_keyframe_string;
            }

            const include = [];
            for (const r of resolutions) {
              if ((r.label === "subtitles" || r.label === "thumbnails") && part.part_index > 1) {
                continue; // Only run subtitles/thumbnails for Part 1
              }
              include.push({ resolution: r, part, chunk_index: 1 });
            }
            console.log(JSON.stringify([{ include }]));
          ' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  optimize:
    needs: build_chunk
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.build_chunk.outputs.chunks) }}
    uses: ./.github/workflows/optimize-runner.yml
    with:
      matrix_json: ${{ toJson(matrix.chunk) }}
    secrets: inherit
